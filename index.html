async function sv(id){const r=RES[id],ref=db.collection('users').doc(ME.uid).collection('saved').doc(id);try{if(SAVED.has(id)){await ref.delete();SAVED.delete(id);toast('Removed from your library')}else{await ref.set({title:r.title,level:r.level,type:r.type,subject:r.subject||'',faculty:r.faculty||'',year:r.year||'',board:r.board||'',desc:r.desc||'',fileUrl:r.fileUrl,fileName:r.fileName||''});SAVED.add(id);toast('Saved to My Library','ok')}route()}catch(e){toast(e.message,'er')}}

function nfix(r){if(r&&!/\.\w{2,5}$/.test(r.fileName||'')){const m=/^data:image\/(\w+)/.exec(r.fileUrl||'');if(m)r.fileName=(r.title||'photo')+'.'+(m[1]=='jpeg'?'jpg':m[1]);else{let n='';try{n=decodeURIComponent((r.fileUrl||'').split('?')[0].split('/').pop())}catch(_){}if(/\.\w{2,5}$/.test(n))r.fileName=n}}return r}

async function rfill(r){if(!r.chunks&&(!r.fileUrl||r.fileUrl=='#')){try{const d=await db.collection('resources').doc(r.id).get();if(d.exists){const x=d.data();r.chunks=x.chunks;r.size=x.size;r.fileName=x.fileName||r.fileName;r.fileUrl=x.fileUrl||r.fileUrl}}catch(_){}}return r}

async function getBytes(r){if(r._u8)return r._u8;{const f=await offId(r.id);if(f&&f.bytes)return new Uint8Array(f.bytes)}if(r.chunks){const s=await db.collection('resources').doc(r.id).collection('chunks').orderBy('i').get(),a=s.docs.map(d=>d.data().d.toUint8Array()),o=new Uint8Array(a.reduce((t,x)=>t+x.length,0));let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o}
 const res=await fetch(r.fileUrl);if(!res.ok)throw Error('Could not open this file.');return new Uint8Array(await res.arrayBuffer())}
async function dl(id){const r=nfix(RES[id]);if(!r)return;await rfill(r);if(!r.chunks){const a=document.createElement('a');a.href=r.fileUrl;a.download=r.fileName||r.title;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();return}
 try{toast('Preparing download…');const b=await getBytes(r),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:MIME[fext(r.fileName)]||'application/octet-stream'}));a.download=r.fileName||r.title;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}catch(e){toast(e.message,'er')}}
function shrinkImg(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onerror=()=>no(Error('That image cannot be read.'));im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas'),x=c.getContext('2d');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})):no(Error('Could not compress the image.')),'image/jpeg',.82)};im.src=u})}

 $('#uf').onsubmit=async e=>{e.preventDefault();const l=$('#ul').value,stt=e.submitter.dataset.s,isFile=$('input[name=um]:checked').value=='file',Bt=$$('#uf button');let ref;Bt.forEach(b=>b.disabled=true);

  catch(er){if(ref){try{const c=await ref.collection('chunks').get();await Promise.all(c.docs.map(d=>d.ref.delete()));await ref.delete()}catch(_){}}
   toast(/permission|insufficient/i.test(er.message)?'Firestore blocked this upload. Publish the latest firestore.rules in Firebase > Firestore > Rules.':er.message,'er');Bt.forEach(b=>b.disabled=false);$('#pb').style.width='0'}}}

function quizPlay(z){let i=0,sc=0,wrong=[];const qs=z.qs.map(q=>({...q})),draw=()=>{if(i>=qs.length){const pct=Math.round(sc/qs.length*100);if(PROF.role=='student'&&typeof award=='function')try{award(Math.max(1,sc))}catch(_){}
  $('#pg').innerHTML=`<div class="qz"><div class="card pf"><h1 style="font-size:2.6rem;color:var(--bl)">${pct}%</h1><h2>${sc} of ${qs.length} correct</h2><p class="mu">${pct>=80?'Excellent work!':pct>=50?'Good effort. Keep practising.':'Keep going. Review the answers below.'}</p><div class="row" style="justify-content:center;margin-top:.8rem"><button class="btn p" id="qr">Play again</button><a class="btn" href="#/myquiz">All quizzes</a></div></div>${wrong.length?`<div class="sh2"><h2>Review</h2></div>${wrong.map(w=>`<div class="card" style="margin-bottom:.6rem"><b>${esc(w.q)}</b><p class="mu">Answer: ${esc(w.o[w.a])}${w.e?'<br>'+esc(w.e):''}</p></div>`).join('')}`:''}</div>`;$('#qr').onclick=()=>quizPlay(z);return}
  const q=qs[i];$('#pg').innerHTML=`<div class="qz"><div class="row" style="justify-content:space-between"><b>${esc(z.title)}</b><span class="mu">${i+1} / ${qs.length}</span></div><div class="qpb" style="margin:.6rem 0 1rem"><i style="width:${i/qs.length*100}%"></i></div><div class="card"><h2 style="font-size:1.2rem">${esc(q.q)}</h2>${q.o.map((o,k)=>`<button class="qo" data-k="${k}">${esc(o)}</button>`).join('')}<div id="qf"></div></div></div>`;
  $$('.qo').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;$$('.qo').forEach(x=>{x.disabled=true;if(+x.dataset.k==q.a)x.classList.add('ok')});if(k==q.a)sc++;else{b.classList.add('no');wrong.push(q)}$('#qf').innerHTML=`${q.e?`<p class="mu">${esc(q.e)}</p>`:''}<button class="btn p" id="qn">${i+1<qs.length?'Next':'See results'}</button>`;$('#qn').onclick=()=>{i++;draw()}})};draw()}

(()=>{let y0=0,x0=0;addEventListener('touchstart',e=>{y0=e.touches[0].clientY;x0=e.touches[0].clientX},{passive:true});
 addEventListener('touchmove',e=>{if(e.touches.length>1)return;const dy=e.touches[0].clientY-y0,dx=e.touches[0].clientX-x0;if(Math.abs(dx)>Math.abs(dy))return;let el=e.target;
  while(el&&el.nodeType==1){if(el===document.documentElement){el=null;break}const o=getComputedStyle(el).overflowY;if((o=='auto'||o=='scroll')&&el.scrollHeight>el.clientHeight+1){const top=el.scrollTop<=0,bot=el.scrollTop+el.clientHeight>=el.scrollHeight-1;if(((dy>0&&top)||(dy<0&&bot))&&e.cancelable)e.preventDefault();return}el=el.parentElement}
  const r=document.scrollingElement||document.documentElement,top=r.scrollTop<=0,bot=r.scrollTop+r.clientHeight>=r.scrollHeight-1;if((r.scrollHeight<=r.clientHeight+1||(dy>0&&top)||(dy<0&&bot))&&e.cancelable)e.preventDefault()},{passive:false})})();
